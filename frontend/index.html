<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synapse - Fichas Técnicas e Custos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="css/base.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
    <link href="css/layout.css" rel="stylesheet" />
    <link href="css/janelas.css" rel="stylesheet" />
    <link href="css/ficha.css" rel="stylesheet" />
    <link href="css/relatorio.css" rel="stylesheet" />
    <link href="css/responsivo.css" rel="stylesheet" />
    <link href="css/impressao.css" rel="stylesheet" />
  </head>
  <body>
    <div id="tela-login" class="tela-login" hidden>
      <div class="login-marca">
        <div class="login-marca-conteudo">
          <div class="logo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
              <path d="m3 8 9 5 9-5" />
              <path d="M12 13v8" />
              <path d="m7.5 5.5 9 5" />
            </svg>
            <span>Synapse</span>
          </div>
          <p class="login-slogan">Fichas técnicas e custos · Gebon Sorvetes</p>
        </div>
      </div>
      <div class="login-area">
        <form class="login-form" onsubmit="sistema.fazerLogin(event)">
          <h1>Bem-vindo!</h1>
          <p class="login-titulo" id="login-titulo"></p>
          <div class="login-aviso" id="login-aviso" role="alert" hidden></div>
          <div id="campo-nome" class="login-campo">
            <label class="form-label" for="login-nome">Seu nome</label>
            <div class="campo-icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
              </svg>
              <input
                class="form-control"
                id="login-nome"
                name="nome"
                autocomplete="name"
                placeholder="Ex.: Maria Silva"
              />
            </div>
          </div>
          <div class="login-campo">
            <label class="form-label" for="login-usuario">Usuário</label>
            <div class="campo-icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
              </svg>
              <input
                class="form-control"
                id="login-usuario"
                name="login"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="Usuário"
                required
              />
            </div>
          </div>
          <div class="login-campo">
            <label class="form-label" for="login-senha">Senha</label>
            <div class="campo-icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="11" width="16" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              </svg>
              <input
                class="form-control"
                id="login-senha"
                name="senha"
                type="password"
                autocomplete="current-password"
                placeholder="Senha"
                required
              />
              <button
                type="button"
                class="botao-ver-senha"
                onclick="sistema.alternarSenha(this)"
                aria-label="Mostrar senha"
              >
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-laranja w-100" id="login-botao" enterkeyhint="go">Entrar</button>
        </form>
      </div>
    </div>

    <div id="tela-sistema" class="layout" hidden>
      <svg hidden>
        <symbol id="i-logo" viewBox="0 0 24 24">
          <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
          <path d="m3 8 9 5 9-5" />
          <path d="M12 13v8" />
          <path d="m7.5 5.5 9 5" />
        </symbol>
        <symbol id="i-catalogo" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </symbol>
        <symbol id="i-produtos" viewBox="0 0 24 24">
          <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
          <path d="m3 8 9 5 9-5" />
          <path d="M12 13v8" />
        </symbol>
        <symbol id="i-ficha" viewBox="0 0 24 24">
          <rect x="8" y="2" width="8" height="4" rx="1" />
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
          <path d="M12 11h4" />
          <path d="M12 16h4" />
          <path d="M8 11h.01" />
          <path d="M8 16h.01" />
        </symbol>
        <symbol id="i-insumos" viewBox="0 0 24 24">
          <path d="m12 2 10 5-10 5L2 7z" />
          <path d="m2 17 10 5 10-5" />
          <path d="m2 12 10 5 10-5" />
        </symbol>
        <symbol id="i-categorias" viewBox="0 0 24 24">
          <path
            d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
          />
        </symbol>
        <symbol id="i-relatorio" viewBox="0 0 24 24">
          <path d="M3 3v18h18" />
          <path d="M7 17v-3" />
          <path d="M11 17v-6" />
          <path d="M15 17V9" />
          <path d="m7 10 4-4 4 3 5-5" />
        </symbol>
        <symbol id="i-usuarios" viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </symbol>
        <symbol id="i-perfil" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <circle cx="12" cy="10" r="3" />
          <path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66" />
        </symbol>
        <symbol id="i-sair" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="m16 17 5-5-5-5" />
          <path d="M21 12H9" />
        </symbol>
      </svg>

      <header class="barra-topo">
        <button
          class="botao-menu"
          onclick="sistema.alternarMenu(true)"
          aria-label="Abrir menu"
          aria-controls="menu"
        >
          <svg class="icone" viewBox="0 0 24 24">
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h16" />
          </svg>
        </button>
        <div class="menu-logo">
          <svg class="icone"><use href="#i-logo" /></svg>Synapse
        </div>
      </header>
      <div class="menu-fundo" onclick="sistema.alternarMenu(false)"></div>

      <nav class="menu" id="menu">
        <button
          class="botao-fechar-menu"
          onclick="sistema.alternarMenu(false)"
          aria-label="Fechar menu"
        >
          <svg class="icone" viewBox="0 0 24 24">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <div class="menu-logo">
          <svg class="icone"><use href="#i-logo" /></svg>Synapse
        </div>
        <div class="menu-empresa">
          <strong>Gebon Sorvetes</strong>
          <span>Gestão de produtos e custos</span>
        </div>

        <div class="menu-itens">
          <button data-aba="catalogo">
            <svg class="icone"><use href="#i-catalogo" /></svg>Catálogo
          </button>
          <button data-aba="produtos" class="so-admin">
            <svg class="icone"><use href="#i-produtos" /></svg>Produtos
          </button>
          <button data-aba="ficha" class="so-admin">
            <svg class="icone"><use href="#i-ficha" /></svg>Ficha Técnica
          </button>
          <button data-aba="insumos" class="so-admin">
            <svg class="icone"><use href="#i-insumos" /></svg>Insumos
          </button>
          <button data-aba="categorias" class="so-admin">
            <svg class="icone"><use href="#i-categorias" /></svg>Categorias
          </button>
          <button data-aba="relatorio" class="so-admin">
            <svg class="icone"><use href="#i-relatorio" /></svg>Relatório de Custo
          </button>
          <button data-aba="usuarios" class="so-admin">
            <svg class="icone"><use href="#i-usuarios" /></svg>Usuários
          </button>
        </div>

        <div class="menu-rodape">
          <button data-aba="perfil">
            <svg class="icone"><use href="#i-perfil" /></svg>Meu perfil
          </button>
          <button onclick="sistema.sair()">
            <svg class="icone"><use href="#i-sair" /></svg>Sair
          </button>
          <div class="menu-usuario">
            <div class="avatar" id="usuario-avatar"></div>
            <div>
              <strong id="usuario-nome"></strong>
              <span id="usuario-perfil"></span>
            </div>
          </div>
        </div>
      </nav>

      <main class="conteudo"></main>
    </div>

    <div id="mensagem" class="no-print"></div>

    <dialog id="janela-ficha" class="janela janela-grande">
      <form method="dialog" class="d-flex justify-content-between">
        <h5 id="janela-ficha-titulo"></h5>
        <button class="btn-close"></button>
      </form>
      <div id="janela-ficha-corpo"></div>
    </dialog>

    <dialog id="janela-editar" class="janela janela-media janela-edicao">
      <form onsubmit="Cadastro.salvarJanela(event)">
        <div class="janela-cabecalho">
          <div class="janela-icone">
            <svg class="icone">
              <use id="editar-icone" href="#i-produtos" />
            </svg>
          </div>
          <div class="flex-grow-1 min-w-0">
            <h5 class="mb-0" id="editar-titulo"></h5>
            <div class="small text-muted text-truncate" id="editar-subtitulo"></div>
          </div>
          <button
            type="button"
            class="btn-close"
            onclick="Tela.elemento('#janela-editar').close()"
          ></button>
        </div>
        <div class="janela-corpo" id="editar-campos"></div>
        <div class="janela-rodape">
          <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="Tela.elemento('#janela-editar').close()"
          >
            Cancelar
          </button>
          <button class="btn btn-laranja" id="editar-botao">Salvar alterações</button>
        </div>
      </form>
    </dialog>

    <dialog id="janela-confirmar" class="janela text-center">
      <form method="dialog">
        <p class="fw-bold" id="confirmar-texto"></p>
        <button class="btn btn-outline-secondary" value="nao">Cancelar</button>
        <button class="btn btn-danger" value="sim" id="confirmar-botao">Confirmar</button>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="js/tela.js"></script>
    <script src="js/api.js"></script>
    <script src="js/abas/aba.js"></script>
    <script src="js/abas/cadastro.js"></script>
    <script src="js/abas/catalogo.js"></script>
    <script src="js/abas/produto.js"></script>
    <script src="js/abas/ficha.js"></script>
    <script src="js/abas/insumo.js"></script>
    <script src="js/abas/categoria.js"></script>
    <script src="js/abas/relatorio.js"></script>
    <script src="js/abas/usuario.js"></script>
    <script src="js/abas/perfil.js"></script>
    <script src="js/sistema.js"></script>
  </body>
</html>
