<section id="aba-insumos">
  <div class="cabecalho-aba">
    <h2>Insumos</h2>
    <button
      class="btn btn-laranja"
      onclick="sistema.abas.insumos.novo()"
    >
      + Novo insumo
    </button>
  </div>
  <div class="row g-2 mb-3">
    <div class="col-md-8">
      <input
        class="form-control"
        id="insumos-busca"
        placeholder="Buscar por nome ou unidade..."
        oninput="sistema.abas.insumos.desenhar()"
      />
    </div>
    <div class="col-md-4">
      <select
        class="form-select"
        id="insumos-situacao"
        onchange="sistema.abas.insumos.desenhar()"
      >
        <option value="ativos">Só ativos</option>
        <option value="inativos">Só inativos</option>
        <option value="">Todos</option>
      </select>
    </div>
  </div>
  <div class="row modelo-cadastro" hidden>
    <div>
      <label class="form-label">Nome</label
      ><input
        class="form-control"
        name="nome"
        maxlength="60"
        required
      />
    </div>
    <div>
      <label class="form-label">Unidade</label>
      <select class="form-select" name="unidade">
        <option value="KG">KG (quilo)</option>
        <option value="G">G (grama)</option>
        <option value="L">L (litro)</option>
        <option value="ML">ML (mililitro)</option>
        <option value="UN">UN (unidade)</option>
      </select>
    </div>
    <div>
      <label class="form-label">Custo por unidade (R$)</label
      ><input
        class="form-control"
        name="custo"
        type="number"
        step="0.0001"
        min="0"
        required
      />
    </div>
  </div>
  <table class="table table-hover bg-white">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Unidade</th>
        <th>Custo</th>
        <th>Situação</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabela-insumos"></tbody>
  </table>
</section>
