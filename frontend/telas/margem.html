<section id="aba-margem">
  <h2 class="no-print">Margem de Lucro</h2>
  <div class="card card-body mb-3 no-print relatorio-filtros">
    <p class="small text-muted mb-3">
      Compara o custo de cada produto ativo com o preço de venda. Margens abaixo de 30% aparecem em
      vermelho.
    </p>
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label" for="margem-categoria">Categoria</label>
        <select class="form-select" id="margem-categoria"></select>
      </div>
      <div class="col-md-3">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="margem-baixa" />
          <label class="form-check-label" for="margem-baixa">Só margem abaixo de 30%</label>
        </div>
      </div>
      <div class="col-md-5 d-flex gap-2">
        <button class="btn btn-laranja" onclick="sistema.abas.margem.gerar()">
          Gerar relatório
        </button>
        <button
          class="btn btn-outline-secondary"
          id="margem-imprimir"
          onclick="window.print()"
          hidden
        >
          Imprimir
        </button>
      </div>
    </div>
  </div>
  <div id="margem-resultado"></div>
</section>
