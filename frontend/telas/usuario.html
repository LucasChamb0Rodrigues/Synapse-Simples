<section id="aba-usuarios">
  <div class="cabecalho-aba">
    <h2>Usuários</h2>
    <button class="btn btn-laranja" onclick="sistema.abas.usuarios.novo()">+ Novo usuário</button>
  </div>
  <div class="row g-2 mb-3">
    <div class="col-md-8">
      <input
        class="form-control"
        id="usuarios-busca"
        placeholder="Buscar por nome ou login..."
        oninput="sistema.abas.usuarios.desenhar()"
      />
    </div>
    <div class="col-md-4">
      <select
        class="form-select"
        id="usuarios-situacao"
        onchange="sistema.abas.usuarios.desenhar()"
      >
        <option value="ativos">Só ativos</option>
        <option value="inativos">Só inativos</option>
        <option value="">Todos</option>
      </select>
    </div>
  </div>
  <div class="row modelo-cadastro" hidden>
    <div>
      <label class="form-label">Nome</label><input class="form-control" name="nome" required />
    </div>
    <div>
      <label class="form-label">Login</label><input class="form-control" name="login" required />
    </div>
    <div>
      <label class="form-label">Senha</label
      ><input
        class="form-control"
        name="senha"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      />
    </div>
    <div>
      <label class="form-label">Perfil</label>
      <select class="form-select" name="perfil">
        <option value="usuario">Usuário (só consulta)</option>
        <option value="admin">Admin (administrador)</option>
      </select>
    </div>
  </div>
  <table class="table table-hover bg-white">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Login</th>
        <th>Perfil</th>
        <th>Situação</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabela-usuarios" data-lista></tbody>
  </table>
</section>
